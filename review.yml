  - date: '2026-09-01'
    rating: 3
    summary: >-
      University pipeline re-profile under the operator axis. The June 2026 profile was already free
      of vendor misattribution — its two surfaces were both genuinely institution-hosted — but it
      recorded only those two and missed the classes a host-based scan cannot see. This pass adds
      four institution-operated surfaces the earlier review did not find: a keyless EPrints REST read
      interface on the repository (GET /rest/eprint/ returns 7.4MB of eprint ids with no credentials),
      an Active Directory Federation Services OAuth 2.0 / OpenID Connect authorization server at
      fs.liverpool.ac.uk with public discovery and JWKS, a Shibboleth SAML 2.0 identity provider
      registered in the UK Access Management Federation as
      urn:mace:eduserv.org.uk:athens:provider:liv.ac.uk and served live by the federation MDQ, and the
      institution's own Microsoft Entra ID tenant. Four registry memberships are now recorded
      (DataCite BL.LPOOL / prefix 10.17638 / 16,405 DOIs resolving into livrepository, ORCID via the
      Jisc UK consortium, ROR 04xs57h96, Crossref member 2165 through Liverpool University Press) and
      four vendor tenancies are recorded as tenancies rather than credited as Liverpool engineering
      (Ex Libris Alma/Primo VE, Talis Aspire, Instructure Canvas, Symplectic Elements). Seven of the
      twelve education-regime domain standards are now evidenced from live endpoints. Two corrections
      to the June review: sso.liverpool.ac.uk does not resolve because the IdP is at
      shibboleth3.liv.ac.uk and fs.liverpool.ac.uk, and the 403 on livrepository.liverpool.ac.uk is a
      User-Agent filter (403 to a browser UA, 200 to a harvester), not a dead host. No OpenAPI was
      generated: every contract behind these surfaces is a product contract shared by every EPrints,
      Canvas, Alma, Talis and Elements deployment, and belongs in the vendor's repo, not here.
