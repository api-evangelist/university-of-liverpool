x-coverage:
  state: covered
  reason: covered
  detail: >-
    Five institution-operated machine surfaces were found and verified live on 2026-09-01 — two
    EPrints OAI-PMH 2.0 providers (livrepository and datacat), a keyless EPrints REST read interface,
    an AD FS OAuth 2.0/OpenID Connect authorization server with public discovery and JWKS at
    fs.liverpool.ac.uk, and a Shibboleth SAML 2.0 IdP published in the UK Access Management
    Federation and eduGAIN — plus a Microsoft Entra ID tenant and four registry memberships
    (DataCite BL.LPOOL/10.17638, ORCID via the UK consortium, ROR 04xs57h96, Crossref through
    Liverpool University Press). Seven of the twelve education-regime domain standards are evidenced
    from public endpoints: oai-pmh, shibboleth, saml, orcid, datacite, crossref and lti (the last on
    a tenant). Four vendor platforms are recorded as tenant relationships rather than as Liverpool
    contracts: Ex Libris Alma/Primo VE, Talis Aspire, Instructure Canvas and Symplectic Elements. No
    OpenAPI, no developer portal, no self-service key issuance and no course/timetable API exist
    anywhere on the institution's public surface, and none has been generated to stand in for one —
    the EPrints, DSpace-style, Canvas and Elements contracts are product contracts shared by every
    deployment of that software and belong in the vendor's own repo, not here. Two negative findings
    worth keeping: livrepository.liverpool.ac.uk answers 403 to a desktop-browser User-Agent and 200
    to a harvester, and the institution's WordPress newsroom gates /wp-json while leaving RSS open.
    No .well-known/security.txt, llms.txt or apis.json is served on www.liverpool.ac.uk (all 404).
