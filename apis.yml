      EPrints 3.4.5 open-access archive of research outputs (journal articles, conference papers,
      theses, reports and books), served from the institution's own host. Verified live 2026-09-01:
      verb=Identify returns 200 with repositoryName "The University of Liverpool Repository",
      repositoryIdentifier livrepository.liverpool.ac.uk, deletedRecord "persistent", granularity
      YYYY-MM-DDThh:mm:ssZ, earliestDatestamp 2016-03-29T13:54:54Z and full metadata, data and
      submission policy statements. verb=ListMetadataFormats returns eight prefixes — didl, mets,
      oai_bibl, oai_dc, primo_dc, rdf, rioxx and uketd_dc (the UK EThOS thesis profile). The EPrints
      software is the University of Southampton's; the deployment, the host, the DOIs and the data
      are Liverpool's, and no EPrints product contract is saved under this institution. Note the
      User-Agent filter on this host: 200 to a harvester UA, 403 to a desktop-browser UA.
