description: >-
  The University of Liverpool is a public research university in Liverpool, United Kingdom, a
  founding member of the Russell Group and of the civic "red brick" universities. It runs no public
  developer portal, publishes no OpenAPI, issues no API keys, and this profile does not pretend
  otherwise. What it does operate, on its own liverpool.ac.uk and liv.ac.uk hosts, are five genuinely
  institution-run machine surfaces: two EPrints OAI-PMH 2.0 providers — the University of Liverpool
  Repository (EPrints 3.4.5, eight metadata formats including RIOXX and uketd_dc) and DataCat, the
  research data catalogue (EPrints 3.4.4) — a keyless EPrints REST read interface on the repository,
  an Active Directory Federation Services OAuth 2.0 / OpenID Connect authorization server at
  fs.liverpool.ac.uk whose discovery document and JWKS are public, and a Shibboleth SAML 2.0 identity
  provider registered in the UK Access Management Federation and visible in eduGAIN. Its DataCite
  membership (BL.LPOOL, prefix 10.17638, 16,405 DOIs resolving into its own repository), its ORCID
  affiliation programme, its ROR record and its Crossref presence through Liverpool University Press
  are all verifiable from public endpoints. Alongside these it is a tenant on four vendor platforms —
  Ex Libris Alma/Primo VE, Talis Aspire reading lists, Instructure Canvas and Symplectic Elements —
  whose contracts belong to those vendors, not to Liverpool. Student records, timetabling, module
  enrolment and the VLE sit behind SSO and are not publicly documented APIs. One trap worth
  recording: livrepository.liverpool.ac.uk returns 403 to a desktop-browser User-Agent and 200 to a
  harvester, so a browser-only probe grades a live repository dead.
